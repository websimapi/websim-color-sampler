<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Sampler</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "chroma-js": ":"https://cdn.jsdelivr.net/npm/chroma-js@2.4.2/dist/chroma-js.mi.js"
            }
        }
    </script>
    <script type="module" src="script.js"></script>
</head>
<body>
    <h1>Color Sampler</h1>

    <div class="input-area">
        <label for="fileInput" class="button">Upload Image</label>
        <input type="file" id="fileInput" accept="image/*">
        <span>or paste image below</span>
    </div>

    <textarea id="pasteArea" placeholder="Paste image here"></textarea>

    <div class="image-container">
        <canvas id="imageCanvas"></canvas>
        <div id="eyedropperPreview" class="eyedropper-preview"></div>
        <div id="eyedropperCoords" class="eyedropper-coords"></div>
    </div>

    <div class="controls">
        <button id="clearImageButton">Clear Image</button>
    </div>


    <div class="palette-area">
        <h2>Palette</h2>
        <div class="palette-header">
             <input type="text" id="paletteNameInput" placeholder="Palette Name">
             <button id="savePaletteButton">Save Palette</button>
             <button id="loadPaletteButton">Load Palette</button>
             <button id="clearPaletteButton">Clear Palette</button>
        </div>
        <ul id="colorPalette">
            <!-- Colors will be added here -->
        </ul>
    </div>

    <div id="copiedMessage" class="copied-message">Copied!</div>

</body>
</html>
